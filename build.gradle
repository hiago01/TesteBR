// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://artifacts.applovin.com/android' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'com.google.gms:google-services:4.6.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}


allprojects {
    repositories {
        // Google primeiro: androidx/material/firebase so existem la. Um repositorio fora do ar (o antigo
        // mint.splunk.com, descontinuado) derruba a resolucao inteira de dependencias quando a versao nao esta no cache.
        google()
        mavenCentral()
        // JitPack so para o PRDownloader (nao consultado para mais nada)
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.amitshekhariitbhu' }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}