name: Build SA-MP 2.10 Android

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: 36.0.0
      ANDROID_NDK_VERSION: 26.2.11394342
      ANDROID_CMAKE_VERSION: 3.22.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          ./gradlew --version

          echo "===== CMAKE ====="
          cmake --version

          echo "===== NINJA ====="
          ninja --version

          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed | grep -E \
            "platforms;android-36|build-tools;36.0.0|ndk;26.2.11394342|cmake;3.22.1" || true

          echo "===== NDK ====="
          echo "$ANDROID_NDK_HOME"

          echo "===== NDK CLANG ====="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Clean
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: samp-2.10-debug
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          if-no-files-found: error
          retention-days: 7
