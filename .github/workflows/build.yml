name: Build SA-MP 2.10 Android

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: 36.0.0
      ANDROID_NDK_VERSION: 26.2.11394342
      ANDROID_CMAKE_VERSION: 3.22.1

    steps:

      # ============================================================
      # 1. Baixar o código do projeto
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v7

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 4. Instalar SDK 36, Build Tools, NDK 26.2 e CMake 3.22.1
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      # ============================================================
      # 5. Configurar variáveis do Android/NDK
      # ============================================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          echo "${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}/bin" >> "$GITHUB_PATH"

          echo "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 6. Mostrar versões reais utilizadas
      # ============================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          ./gradlew --version

          echo "===== CMAKE ====="
          cmake --version

          echo "===== NINJA ====="
          ninja --version

          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed | grep -E \
            "platforms;android-36|build-tools;36.0.0|ndk;26.2.11394342|cmake;3.22.1" || true

          echo "===== NDK ====="
          echo "$ANDROID_NDK_HOME"

          echo "===== NDK CLANG ====="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      # ============================================================
      # 7. Corrigir permissão do Gradle Wrapper
      # ============================================================
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          chmod +x ./gradlew

      # ============================================================
      # 8. Limpar build anterior
      # ============================================================
      - name: Clean
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      # ============================================================
      # 9. BUILD DEBUG
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 10. Procurar APKs gerados
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      # ============================================================
      # 11. Enviar APK para os Artifacts do GitHub
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: samp-2.10-debug
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          if-no-files-found: error
          retention-days: 7

Estrutura no seu projeto

No seu "2.10-OpenSource", ficará assim:

2.10-OpenSource/
├── app/
├── build.gradle
├── settings.gradle
├── gradlew
├── gradlew.bat
├── gradle/
│   └── wrapper/
└── .github/
    └── workflows/
        └── build.yml

Como criar pelo Termux

Dentro do projeto:

mkdir -p .github/workflows

nano .github/workflows/build.yml

Cole o conteúdo acima.

Depois:

git add .github/workflows/build.yml
git commit -m "Add Android GitHub Actions build"
git push

Se ainda não tiver configurado o "origin":

git remote -v

O que vai acontecer

O GitHub vai pegar seu projeto e criar uma máquina:

Ubuntu x86_64
       ↓
JDK 17
       ↓
Android SDK 36
       ↓
NDK 26.2.11394342
       ↓
CMake 3.22.1
       ↓
Ninja
       ↓
Gradle 8.9 do seu wrapper
       ↓
CMake
       ↓
libsamp.so
       ↓
APK Debug

Isso é importante: o NDK x86_64 será executado nativamente na VM x86_64 do GitHub, então não teremos mais o problema do seu celular:

ARM64
 ↓
Box64
 ↓
clang-17 x86_64
 ↓
posix_spawn
 ↓
*** buffer overflow detected ***

Além disso, o workflow instala explicitamente "ndk;26.2.11394342" e "cmake;3.22.1"; esse padrão de instalação via "sdkmanager" é usado em workflows Android existentes.

⚠️ Um detalhe importante do seu projeto

Eu não colocaria ainda nenhuma configuração como:

-DCMAKE_C_COMPILER=/root/ndk-box64/clang

nem wrappers "clang", "clang++" ou "lld".

No GitHub Actions, queremos que o CMake encontre o NDK original:

$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/

Exatamente como deveria acontecer em uma máquina Linux x86_64 convencional.

Se a primeira build falhar

Não altere dezenas de arquivos.

Me mande a partir de "FAILURE:" até o final do log. A partir daí podemos corrigir especificamente o próximo problema — seja CMake, NDK, "libsamp.so", Gradle ou alguma incompatibilidade do código-fonte.

O objetivo é chegar a:

BUILD SUCCESSFUL

e depois:

Artifacts
└── samp-2.10-debug
    └── app-debug.apk

que você poderá baixar diretamente pelo celular.
